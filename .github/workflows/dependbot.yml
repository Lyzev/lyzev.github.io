# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Lyzev/lyzev.github.io'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        if: |
          contains(steps.metadata.outputs.dependency-names, 'brace-expansion') ||
          contains(steps.metadata.outputs.dependency-names, 'vite') ||
          contains(steps.metadata.outputs.dependency-names, 'react-router-dom') ||
          contains(steps.metadata.outputs.dependency-names, 'eslint') ||
          contains(steps.metadata.outputs.dependency-names, '@types/node') ||
          contains(steps.metadata.outputs.dependency-names, 'typescript-eslint')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
